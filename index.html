<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday Thankus ❤️</title>

<style>
*{margin:0;padding:0;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:black;
overflow:hidden;
font-family:Arial,sans-serif;
color:white;
text-align:center;
}

.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 5% 10%, white, transparent),
radial-gradient(2px 2px at 15% 40%, white, transparent),
radial-gradient(2px 2px at 25% 20%, white, transparent),
radial-gradient(2px 2px at 35% 80%, white, transparent),
radial-gradient(2px 2px at 45% 30%, white, transparent),
radial-gradient(2px 2px at 55% 70%, white, transparent),
radial-gradient(2px 2px at 65% 15%, white, transparent),
radial-gradient(2px 2px at 75% 55%, white, transparent),
radial-gradient(2px 2px at 85% 35%, white, transparent),
radial-gradient(2px 2px at 95% 85%, white, transparent),
black;
animation:twinkle 1.5s ease-in-out infinite alternate;
}

@keyframes twinkle{
0%{opacity:0.6;}
50%{opacity:1;}
100%{opacity:0.5;}
}

.content{
position:relative;
z-index:2;
}

h1{
font-size:42px;
color:#ff4d6d;
text-shadow:0 0 20px #ff4d6d;
}

p{
font-size:22px;
margin-top:15px;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="content">
<h1>Happy Birthday Thankus ❤️</h1>
<p>Across Every Universe... I'd still find you.</p>
</div>

</body>
</html>
